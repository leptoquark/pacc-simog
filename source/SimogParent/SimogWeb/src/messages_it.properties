# Home
home.welcome=Benvenuto
home.simog=SIMOG
home.description=Attraverso le funzionalità messe a disposizione dal SIMOG è ora possibile accedere in maniera rapida e diretta alle informazioni relative alle Gare ed ai Lotti che le costituiscono
home.supporto=Per tutte le necessità riguardanti Supporto ed Assistenza, rivolgiti senza esitare al Contact Center che sarà certamente risolvere ogni dubbio, procedendo con celerità e cortesia alla risoluzione di eventuali problemi durante il tuo lavoro
home.errore=In caso di errore sarà visualizzato il messaggio relativo ed un Codice di Errore che ti sarà richiesto al momento della chiamata al Contact Center. Questo renderà più agevole la risoluzione del problema, e potrai tornare rapidamente a completare l'operazione.
home.analisiGare=L'analisi delle Gare
home.analisiGareDesc=Da oggi è più semplice accedere alle informazioni dettagliate riguardanti ogni gara, con la possibilità di visualizzare lo stato dei Pagamenti, accedere alle informazioni con criteri di ricerca utili ed efficaci con la possibilità di "navigare" attraverso le informazioni.
home.menu=Utilizza il menu che trovi in alto per procedere alla navigazione delle varie aree a tua disposizione
