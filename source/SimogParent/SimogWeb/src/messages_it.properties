# Home RSSA/RUP/OSR
home.gestioneGare=La gestione delle Gare
home.creazioneGare=La creazione delle Gare
home.gestioneSchede=La gestione delle Schede
home.simogDesc=Attraverso le funzionalità messe a disposizione dal sistema SIMOG è possibile gestire gare per conto della propria Stazione Appaltante di riferimento.
home.consultazioneGare=Attraverso le funzionalità messe a disposizione dal sistema SIMOG è possibile consultare gare competenti per territorio.
home.supportoDesc=Per tutte le necessità riguardanti Supporto ed Assistenza è possibile rivolgersi al Contact Center, a disposizione per rispondere ad ogni tipo di dubbio con celerità e cortesia, risolvendo gli eventuali problemi che si dovessero presentare durante il lavoro.
home.erroreDesc=In caso di errore il Contact Center richiederà il Codice di Errore visualizzato in alto sulla pagina.
home.codiceErrore=Prendere nota del Codice di Errore renderà più agevole la risoluzione del problema, consentendo di ripristinare rapidamente l'operatività sul sistema.
home.guidaServizio=Ricorda di verificare con opportuna frequenza di possedere l'ultima versione della Guida al Servizio!
home.indicazioniAggiornate=Sarà possibile trovare indicazioni sempre più aggiornate relativamente ai problemi più comuni.
home.codificaGare=SIMOG rende molto semplice la codifica delle Gare bandite dalla Stazione Appaltante per le quali si è stati individuati in qualità di responsabili.
home.menuNavigazione=Il menu che si trova in alto permette di procedere alla navigazione attraverso le varie funzionalità messe a disposizione dal sistema.
home.creazioneNuovaGara=Grazie alla funzionalità di Creazione una nuova gara è possibile, inserendo pochi dati di sintesi, ottenere il codice identificativo CIG da comunicare alle imprese che intendono presentare un'offerta.
home.gestioneSchedeDesc=Grazie alla funzionalità di Gestione Schede è possibile, gestire le aggiudicazioni delle gare per le quali è scaduta la data di partecipazione.
home.ricercaGare=Utilizzando le funzionalità di ricerca è possibile individuare le gare di interesse, tra quelle di competenza, operando eventualmente modifiche e integrazioni.
home.navigazioneLotti=E' possibile navigare attraverso i Lotti componenti e scegliere l'operazione da eseguire tra quelle proposte attraverso i menu associati ad ogni lotto.
home.perfezionamentoComunicazione=Ricorda che per consentire ai partecipanti il pagamento del contributo all'Autorità è necessario perfezionare la comunicazione con la data di pubblicazione e la data di scadenza della presentazione delle offerte del singolo Lotto.
home.sistemaRiscossione=Il sistema di riscossione non accetterà pagamenti in data successiva a quella indicata per la presentazione delle offerte e, a partire dal giorno successivo, sarà possibile visualizzare l'elenco delle imprese che hanno assolto alla contribuzione per la gara in oggetto.

