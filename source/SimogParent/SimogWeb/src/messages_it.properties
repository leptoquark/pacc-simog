# FAQ
faq.titoloFaqServizio=Domande frequenti sul servizio SIMOG
faq.domanda1=Ho creato una gara sul servizio SIMOG ma anziché rilasciare il CIG il sistema ha rilasciato solo un numero GARA
faq.domanda2=Ho smarrito la password per l'accesso nel servizio SIMOG come RSSA/RUP. Come posso fare per recuperarla?
faq.domanda3=Desidererei cancellare un lotto di Gara creato per errore nel servizio SIMOG. Qual è la procedura da seguire?
faq.domanda4=Desidererei modificare una Gara SIMOG/CIG/Lotto per inserimento dati non corretti. Qual è la procedura da seguire?
faq.risposta1=Per acquisire il codice CIG per qualsiasi tipo di gara (lotto unico o più lotti) è indispensabile creare una gara, e aggiungere il/i lotto/i cliccando sull'apposito pulsante "Aggiungi lotto".
faq.risposta2=In caso di smarrimento della password per l'accesso nel servizio SIMOG occorre eseguire la procedura di "rinegoziazione" di una nuova password. A tale scopo si dovrà accedere al sito <a href="https://servizi.anticorruzione.it/">https://servizi.anticorruzione.it</a>, quindi cliccare su "Recupera password", inserire il proprio codice fiscale ed il codice di sicurezza, cliccare nuovamente su "Recupera password" e seguire le istruzioni che saranno inviate via mail all'ultimo indirizzo comunicato. Laddove questo indirizzo non fosse più disponibile è necessario inviare una richiesta fax di sblocco dell'account utente al numero <b>06.36.72.34.77</b> con allegata copia di un documento di riconoscimento in corso di validità.
faq.risposta3=La cancellazione di un lotto di gara erroneamente creato può essere eseguita esclusivamente se non è stata eseguita l'operazione di perfezionamento. Tutti i dati dei lotti in stato di lavorazione possono essere modificati con l'apposita funzionalità di modifica messa a disposizione dal sistema. Le date comunicate in fase di perfezionamento possono essere rettificate nell'arco della giornata in cui è stato eseguita l'operazione di perfezionamento selezionando nuovamente la voce "Perfeziona".
faq.risposta4=La richiesta di rettifica può riguardare esclusivamente i dati caratterizzanti la gara ai fini della riscossione del contributo (data di scadenza per la presentazione delle offerte, importo, data di pubblicazione). La richiesta, opportunamente motivata, deve essere inviata via fax al n. <b>06.36.72.34.77</b> indicando il codice CIG, il valore corrente del dato da rettificare e il corrispondente nuovo valore. Alla richiesta deve essere allegata una copia fotostatica di un documento di riconoscimento in corso di validità del RSSA che ha prenotato il codice.
faq.tornaSu=Torna su
guida.istruzioniPdf=La Guida al servizio è in formato <acronym title="Adobe Portable Document Format">pdf</acronym> e può essere visualizzata cliccando sull'icona. Per scaricarla clicca sul tasto destro del mouse, seleziona "Salva oggetto con nome" e scegli sul tuo computer la cartella in cui salvare il file.<br><br>Per aprire i documenti in formato pdf hai bisogno del programma <span lang="en">Acrobat Reader</span>. Puoi scaricarlo gratuitamente cliccando sull'icona posta sotto.
# Errore
errore.possibiliCause=Possibili Cause
errore.causa1=Si è tentato un accesso ad una risorsa protetta senza aver effettuato l'accesso
errore.soluzione1=Per effettuare l'accesso correttamente si può utilizzare la pagina di login
errore.causa2=Non si sono utilizzati gli <acronym title="Strumenti di Gestione">Strumenti di navigazione</acronym> e questo ha dato origine ad un errore
errore.soluzione2=Utilizzare gli <acronym title="Strumenti di Gestione">Strumenti di navigazione</acronym>
errore.causa3=Il sistema potrebbe essere non disponibile
errore.soluzione3=Verificare le fasce orarie di disponibilità del Sistema

