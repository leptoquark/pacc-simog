	<tr>
	     <td><label >Gazzetta Ufficiale Comunit Europea - GUCE</label></td>
 			<td>
				<input  tabindex="" style="text-align:center;" onchange="setFormModified('Modificato')" 
				    [variable]
					type="text" id="inputGazzettaCE" name="" 
					onblur="Calendar.validaData(this)" value="[condition]">
				[condition]
					<script type="text/javascript">
						    Calendar.setup({
					        inputField     :    "inputGazzettaCE",     // id of the input field
					        ifFormat       :    "%d/%m/%Y",      // format of the input field
					        button         :    "calendarGazzettaCE",  // trigger for the calendar (button ID)
					        align          :    "Tl",           // alignment (defaults to "Bl")
					        singleClick    :    true							       
				    		});					    	
					</script>
				</c:if>
			</td>
	   	</tr>
