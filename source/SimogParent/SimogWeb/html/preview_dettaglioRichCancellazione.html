function changeTab(tabName, idmodificato) {  var scelta = true;  if (document.forms[0].elements[idmodificato].value == 1) {  scelta = confirm("Attenzione ! I dati potrebbero essere cambiati. Prosegui con il rischio di perdere i dati?");  }  if (scelta) {  document.forms[0].elements[''].value = tabName;  document.forms[0].elements[''].value = "";  document.forms[0].submit();  } }
function checkAndChange(tabName, idmodificato) {  alert("checkAndChange - funzione obsoleta"); }
function setFormModified(idmodificato) {  if (document.getElementById("Modificato") != null) document.getElementById("Modificato").value = 1;  document.getElementById(idmodificato).value = 1; }
function resetFormModified(idmodificato) {  document.getElementById(idmodificato).value = 0; }
function salva(tabName) {  if (validateRadios(tabName)) {  if (confirm("I dati verranno salvati. Procedere?")) {  document.forms[0].elements[''].value = tabName;  document.forms[0].elements[''].value = "";  if (tabName == "") {  document.forms[0].elements[''].value = "true";  }  document.forms[0].submit();  }  } }
function salvaDue(actiontype) {  if (confirm("I dati verranno salvati. Procedere?")) {  document.forms[0].elements[''].value = actiontype;  document.forms[0].submit();  } }
function conferma(tabName) {  if (confirm("I dati verranno confermati. Procedere?")) {  document.forms[0].elements[''].value = tabName;  document.forms[0].elements[''].value = "";  if (tabName == "") {  document.forms[0].elements[''].value = "true";  }  document.forms[0].submit();  } }
function aggiungi(tabName) {  document.forms[0].elements[''].value = tabName;  document.forms[0].elements[''].value = "";  setForwardPage(tabName);  document.forms[0].submit(); }
function setForwardPage(tabName) {  if (tabName == "") {  document.forms[0].elements['pagina'].value = "scheda1/aggiudicazioni.jsp";  }  if (tabName == "") {  document.forms[0].elements['pagina'].value = "scheda1/schedaSottosoglia.jsp";  }  if (tabName == "") {  document.forms[0].elements['pagina'].value = "scheda1/pubblicazioneEsito.jsp";  }  if (tabName == "") {  document.forms[0].elements['pagina'].value = "scheda1/affidatario.jsp";  }  if (tabName == "") {  document.forms[0].elements['pagina'].value = "scheda1/responsabileProcedimento.jsp";  }  if (tabName == "") {  document.forms[0].elements['pagina'].value = "scheda1/contenzioso.jsp";  }  if (tabName == "") {  document.forms[0].elements['pagina'].value = "scheda1/addContenzioso.jsp";  }  if (tabName == "") {  document.forms[0].elements['pagina'].value = "scheda1/addAffidatario.jsp";  }  if (tabName == "") {  document.forms[0].elements['pagina'].value = "scheda1/listaSoggettiPartecipanti.jsp";  }  if (tabName == "") {  document.forms[0].elements['pagina'].value = "gestioneAggiudicazioni.jsp";  } }
function reimposta(tabName) {  var scelta = true;  if (tabName == "" || tabName == "" || tabName == "" || tabName == "") {  if (document.getElementById("Modificato").value == 1) {  scelta = confirm("Attenzione! In questo modo tutte le modifiche apportate al documento andranno perse. Continuare?");  if (scelta) {  document.forms[0].elements[''].value = tabName;  document.forms[0].elements[''].value = "";  document.forms[0].submit();  }  }  } else {  if (document.getElementById("Modificato0").value == 1) {  scelta = confirm("Attenzione! In questo modo tutte le modifiche apportate al documento andranno perse. Continuare?");  if (scelta) {  document.forms[0].reset();  }  }  } }
function add(tabName) {  document.forms[0].elements[''].value = tabName;  document.forms[0].elements[''].value = "";  if (tabName == "") {  document.forms[0].elements['pagina'].value = "scheda1/addContenzioso.jsp";  }  if (tabName == "") {  document.forms[0].elements['pagina'].value = "scheda1/addAffidatario.jsp";  }  document.forms[0].submit(); }
function changePage(servletdacaricare, idmodificato) {  var scelta = true;  if (document.forms[0].elements[idmodificato].value == 1) {  scelta = confirm("Attenzione ! I dati potrebbero essere cambiati. Prosegui con il rischio di perdere i dati?");  }  if (scelta) {  document.forms[0].action = servletdacaricare;  document.forms[0].submit();  } }
function cancella(tabName, args) {  if (confirm("Si sta per cancellare il record. Proseguire?")) {  document.forms[0].elements[''].value = tabName;  for (var i = 0; i < args.length; i++) {  document.forms[0].elements[args[i]].value = args[++i];  }  document.forms[0].submit();  } }

function changeFromAffidatario(tabName, idPartecipante, denPartecipante, dataInizioAggiudicatario) {  document.forms[0].elements[''].value = tabName;  document.forms[0].elements[''].value = "";  document.forms[0].elements[''].value = idPartecipante;  document.forms[0].elements[''].value = denPartecipante;  document.forms[0].elements[''].value = dataInizioAggiudicatario;  document.forms[0].elements['pagina'].value = "scheda1/addAffidatario.jsp";  document.forms[0].submit(); }

function trim(stringa) {  while (stringa.substring(0, 1) == ' ') {  stringa = stringa.substring(1, stringa.length);  }  while (stringa.substring(0, 1) == '\n') {  stringa = stringa.substring(1, stringa.length);  }  while (stringa.substring(stringa.length - 1, stringa.length) == ' ') {  stringa = stringa.substring(0, stringa.length - 1);  }  tmpStringa = "";  for (i = 0; i < stringa.length; i = i + 1) {  if (stringa.charAt(i) == ' ' || stringa.charAt() == '%') {} else tmpStringa = tmpStringa + stringa.charAt(i);  }  return tmpStringa; }
function cercaInRubrica(tabName) {  document.forms[0].elements[''].value = tabName;  codiceFiscale = trim(document.getElementById("codiceFiscale").value);  cognome = trim(document.getElementById('').value);  if (document.getElementById('') != null)  nome = trim(document.getElementById('').value);  else  nome = "";  if ((codiceFiscale == "" || codiceFiscale == null) && (cognome == "" || cognome == null) && (nome == "" || nome == null)) {  alert("Inserire almeno uno dei filtri di ricerca");  return;  }  if (codiceFiscale == "" || codiceFiscale == null) {  if (! ((nome.length > 1) || (cognome.length > 1))) {  alert("I filtri di ricerca per Nome e Cognome o Denominazione devono contenere almeno due caratteri");  return;  }  }  document.getElementById('cerca').disabled = true;  document.forms[0].action = 'rubrica?' + "=Cerca in rubrica";  var paramsString = "?" + "=" + "Cerca in rubrica";  document.forms[0].submit(); }
function cercaInRubricaDittaAusiliaria(tabName) {  document.forms[0].elements[''].value = tabName;  codiceFiscale = trim(document.getElementById("codiceFiscale").value);  cognome = trim(document.getElementById('').value);  if (document.getElementById('') != null)  nome = trim(document.getElementById('').value);  else  nome = "";  if ((codiceFiscale == "" || codiceFiscale == null) && (cognome == "" || cognome == null) && (nome == "" || nome == null)) {  alert("Inserire almeno uno dei filtri di ricerca");  return;  }  if (codiceFiscale == "" || codiceFiscale == null) {  if (! ((nome.length > 1) || (cognome.length > 1))) {  alert("I filtri di ricerca per Nome e Cognome o Denominazione devono contenere almeno due caratteri");  return;  }  }  document.getElementById('cerca').disabled = true;  document.forms[0].action = 'rubricaDittaAusiliaria?' + "=Cerca in rubrica";  var paramsString = "?" + "=" + "Cerca in rubrica";  document.forms[0].submit(); }
function loadAnnullamentJSP(tabName) {  var scelta = "Richiedere la modifica del blocco dati in esame?";  var codiceContratto = document.getElementById("CODICE_CONTRATTO");  if (codiceContratto != null && codiceContratto.value != "") {  scelta = "ATTENZIONE: L'Aggiudicazione fa parte di un contratto multi lotto. Procedendo oltre, la presente Aggiudicazione e tutte le altre Aggiudicazioni partecipanti al contratto saranno svincolate dallo stesso. Si desidera proseguire?";  }  if (confirm(scelta)) {  document.forms[0].elements[''].value = tabName;  if (document.forms[0].elements['toDo']) document.forms[0].elements['toDo'].value = "";  document.forms[0].elements[''].value = "";  document.forms[0].submit();  } }
function richiediAnnullamento2(idMotivazioneEsito) {  var motivazione = document.forms[0].elements[idMotivazioneEsito].value;  if (trim(motivazione).length >= 10 && trim(motivazione).length <= 1000) {  return true;  } else {  alert('Inserire una motivazione di almeno 10 caratteri e minore di 1000');  return false;  } }
function loadPages(srv, param) {  document.forms[0].elements[''].value = param;  document.forms[0].elements[''].value = "false";  changePage(srv); }
function urlCallFromCombo(combo) {  var pick = combo.options[combo.selectedIndex].value;  if (pick != "") window.location.replace(pick); }
function inputRadio() {  var radio1 = document.getElementById('radio1');  var radio2 = document.getElementById('radio2');  if (radio1.checked == false && radio2.checked == false) {  alert("Scegliere un tipo di richiesta");  return false;  } else {  return true;  } }
