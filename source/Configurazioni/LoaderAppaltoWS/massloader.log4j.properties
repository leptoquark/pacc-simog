#-------------------------------------------------------------------------------
# Define appenders and root priority level definition
#-------------------------------------------------------------------------------
log4j.logger.MASSLOADER_LOGGER=DEBUG, MASSLOADER_APPENDER, stdOut

#--------------------------------------------------------------------------------
# Define GISP Event Manager Logger
#--------------------------------------------------------------------------------
log4j.additivity.MASSLOADER_LOGGER=false

log4j.appender.MASSLOADER_APPENDER=org.apache.log4j.DailyRollingFileAppender
log4j.appender.MASSLOADER_APPENDER.File=../LoaderAppaltoWS.log
log4j.appender.MASSLOADER_APPENDER.DatePattern='.'yyyy-MM-dd
log4j.appender.MASSLOADER_APPENDER.layout=org.apache.log4j.PatternLayout
log4j.appender.MASSLOADER_APPENDER.layout.ConversionPattern=[%d{yyyy:MM:dd HH:mm:ss,SSS}] [%C{1}] %-5p %c %x - %m%n
log4j.appender.MASSLOADER_APPENDER.threshold=DEBUG

log4j.appender.stdOut.Threshold=ERROR
log4j.appender.stdOut=org.apache.log4j.ConsoleAppender
log4j.appender.stdOut.ImmediateFlush=true
log4j.appender.stdOut.layout=org.apache.log4j.PatternLayout
log4j.appender.stdOut.layout.ConversionPattern=[%d{yyyy:MM:dd HH:mm:ss,SSS}] [%C{1}] %-5p %x: %m%n
